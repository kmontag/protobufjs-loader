name: Test PR

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
        # protobufjs and protobufjs-cli are peer dependencies with
        # paired majors (cli 1 -> protobufjs 7, cli 2 -> protobufjs 8).
        # Test each supported pair against every Node version.
        protobufjs:
          - { pkg: '^7.0.0', cli: '^1.0.0' }
          - { pkg: '^8.0.0', cli: '^2.0.0' }

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Install protobufjs ${{ matrix.protobufjs.pkg }} / protobufjs-cli ${{ matrix.protobufjs.cli }}
        run: npm install --no-save protobufjs@${{ matrix.protobufjs.pkg }} protobufjs-cli@${{ matrix.protobufjs.cli }}
      - run: npm run build --if-present
      - run: npm test

  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        protobufjs:
          - { pkg: '^7.0.0', cli: '^1.0.0' }
          - { pkg: '^8.0.0', cli: '^2.0.0' }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - run: npm ci
      - name: Install protobufjs ${{ matrix.protobufjs.pkg }} / protobufjs-cli ${{ matrix.protobufjs.cli }}
        run: npm install --no-save protobufjs@${{ matrix.protobufjs.pkg }} protobufjs-cli@${{ matrix.protobufjs.cli }}
      - run: npm run check
      - run: npm run lint
